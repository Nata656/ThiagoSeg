# Publica o site no GitHub Pages a cada envio (git push) para a branch main.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gerar o site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # O GitHub Pages não conhece as rotas do React: ao abrir direto
      # /ThiagoSeg/contato ele mostraria 404. Com uma cópia do index.html
      # como 404.html, o React assume e mostra a página certa.
      - name: Ajustar rotas para o GitHub Pages
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
